<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="glass-cursor.css">
  <meta charset="utf-8" />
  <title>Handsfree Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="tracker.css" />
</head>
<body>
  <header>
    <h1>Handsfree</h1>
    <span id="badge" class="badge off">starting…</span>
  </header>

  <div class="modes" role="group" aria-label="Cursor control mode">
    <button class="mode" id="modeHead" data-mode="head" aria-pressed="true"><span class="ico" aria-hidden="true">&#128578;</span>HEAD</button>
    <button class="mode" id="modeEyes" data-mode="eyes" aria-pressed="false"><span class="ico" aria-hidden="true">&#128065;</span>EYES</button>
    <button class="mode" id="modeHands" data-mode="hands" aria-pressed="false"><span class="ico" aria-hidden="true">&#9995;</span>HANDS + VOICE</button>
  </div>
  <p class="modeline">Current mode: <strong id="modeName">HEAD</strong></p>
  <p id="modeDesc" class="modedesc"></p>

  <div class="videowrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <p id="status">Starting camera…</p>

  <div class="row">
    <button id="btnCal" class="primary">Calibrate (12 s)</button>
    <button id="btnPause">Pause</button>
  </div>

  <div class="row">
    <button id="btnZoomOut">Zoom −</button>
    <button id="btnZoomReset">100%</button>
    <button id="btnZoomIn">Zoom +</button>
  </div>

  <fieldset>
    <label><input type="checkbox" id="chkDwell" checked /> Dwell click (hold still on a link)</label>
    <label id="rowWink"><input type="checkbox" id="chkWink" checked /> Wink to click</label>
    <label id="rowZoom"><input type="checkbox" id="chkZoom" checked /> Eye zoom (wide eyes or raised eyebrows = zoom in; squint = zoom out)</label>
    <label><input type="checkbox" id="chkVoice" checked /> Voice commands</label>
    <label><input type="checkbox" id="chkEdge" /> Scroll when cursor is at screen edge</label>
  </fieldset>

  <fieldset>
    <label class="slider">Sensitivity
      <input type="range" id="rngGain" min="0.6" max="2.2" step="0.05" value="1.2" />
    </label>
    <label class="slider">Smoothness
      <input type="range" id="rngSmooth" min="0" max="1" step="0.05" value="0.5" />
    </label>
    <label class="slider">Dwell time
      <input type="range" id="rngDwell" min="0.7" max="2.5" step="0.1" value="1.3" />
    </label>
    <label class="slider" id="rowPinch">Pinch threshold
      <input type="range" id="rngPinch" min="0.15" max="0.45" step="0.01" value="0.28" />
    </label>
    <label class="slider" id="rowScrollSpeed">Scroll gesture speed
      <input type="range" id="rngScrollSpeed" min="0.4" max="2.5" step="0.1" value="1" />
    </label>
    <label class="slider">Language
      <select id="selLang">
        <option value="en-IN">English (India)</option>
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="hi-IN">हिन्दी (Hindi)</option>
        <option value="mr-IN">मराठी (Marathi)</option>
        <option value="gu-IN">ગુજરાતી (Gujarati)</option>
        <option value="ta-IN">தமிழ் (Tamil)</option>
      </select>
    </label>
  </fieldset>

  <div id="heard">Heard: —</div>
  <div id="stats"></div>
  <div id="eyeDebug" class="tip">Eyes: waiting for your face…</div>

  <details>
    <summary>Voice commands</summary>
    <div id="help"></div>
    <div id="gestureHelp"></div>
  </details>

  <p class="tip">Keep this window visible (beside your browser, not hidden behind it) and use Chrome.</p>

  <script type="module" src="tracker.js"></script>
  <script src="glass-cursor.js"></script>
</body>
</html>
